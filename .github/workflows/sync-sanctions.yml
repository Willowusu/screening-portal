name: Daily OpenSanctions Sync

on:
  schedule:
    - cron: "0 3 * * *" # Runs daily at 03:00 UTC
  workflow_dispatch:     # Also lets you trigger manually from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install MongoDB Database Tools
        run: |
          wget -q https://mongodb.org
          sudo dpkg -i mongodb-database-tools-ubuntu2204-x86_64-100.10.0.deb

      - name: Download Latest OpenSanctions CSV
        run: |
          curl -L -s -o targets.simple.csv "https://opensanctions.org"
          ls -lh targets.simple.csv

      - name: Import into MongoDB Atlas
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          mongoimport \
            --uri="$MONGODB_URI" \
            --db=test \
            --collection=sanctions \
            --type=csv \
            --headerline \
            --ignoreBlanks \
            --drop \
            --file=targets.simple.csv
