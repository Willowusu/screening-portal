<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PEP Screening</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(at 50% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 60%);
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body class="text-slate-900 min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 selection:bg-blue-600 selection:text-white">
    <main class="w-full max-w-6xl my-auto">
        <!-- Top Header Bar -->
        <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div>
                <div class="inline-flex items-center gap-2 px-2.5 py-0.5 rounded-full bg-blue-50 border border-blue-200/80 text-blue-700 text-[11px] font-medium mb-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-600 animate-pulse"></span>
                    OpenSanctions & Atlas Search
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">
                    PEP Screening Portal
                </h1>
            </div>

            <!-- API Key Input -->
            <div class="relative w-full sm:w-72">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                </div>
                <input id="apiKey" type="password" placeholder="Enter X-API-Key (sk_live_...)"
                    class="w-full pl-10 pr-4 py-2.5 text-xs font-mono bg-white border border-slate-200/90 rounded-xl shadow-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition" />
            </div>
        </header>

        <!-- Two-Column Workspace: Form Left, Results Right -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- Left Column: Screening Form Card -->
            <section class="lg:col-span-5 bg-white/95 backdrop-blur-md p-6 sm:p-7 rounded-2xl shadow-lg shadow-slate-200/60 border border-slate-200/80 lg:sticky lg:top-8">
                <div class="mb-5">
                    <h2 class="text-base font-bold text-slate-900">Entity Details</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Enter subject identifiers for fuzzy watchlist matching.</p>
                </div>

                <form id="searchForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">
                            Full Name / Entity <span class="text-rose-500">*</span>
                        </label>
                        <input id="name" type="text" required placeholder="e.g. Vladimir Putin"
                            class="w-full bg-slate-50/60 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition" />
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">
                                Birth Year / Date
                            </label>
                            <input id="birthDate" type="text" placeholder="e.g. 1952"
                                class="w-full bg-slate-50/60 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">
                                Country Code
                            </label>
                            <input id="country" type="text" placeholder="e.g. ru"
                                class="w-full bg-slate-50/60 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition" />
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="submitBtn"
                            class="w-full inline-flex items-center justify-center gap-2 bg-slate-900 hover:bg-blue-600 text-white font-semibold text-sm px-6 py-3 rounded-xl shadow-sm transition-all cursor-pointer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            <span>Screen Entity</span>
                        </button>
                    </div>

                    <div id="statusText" class="text-xs text-slate-500 min-h-[1.25rem] pt-1"></div>
                </form>
            </section>

            <!-- Right Column: Results & Download Panel -->
            <section class="lg:col-span-7 bg-white/95 backdrop-blur-md rounded-2xl shadow-lg shadow-slate-200/60 border border-slate-200/80 min-h-[420px] flex flex-col">
                <!-- Results Header Bar with Download Options -->
                <div class="px-6 py-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
                    <div>
                        <h2 class="text-base font-bold text-slate-900">Screening Results</h2>
                        <p id="resultsMeta" class="text-xs text-slate-500 mt-0.5">Awaiting query submission</p>
                    </div>

                    <!-- Download Controls -->
                    <div id="downloadControls" class="hidden items-center gap-2">
                        <span class="text-[11px] font-medium text-slate-400 mr-1">Export:</span>
                        <button type="button" id="downloadCsvBtn"
                            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200/80 border border-slate-200/80 transition cursor-pointer">
                            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            CSV
                        </button>
                        <button type="button" id="downloadJsonBtn"
                            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200/80 border border-slate-200/80 transition cursor-pointer">
                            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            JSON
                        </button>
                    </div>
                </div>

                <!-- Results Body -->
                <div id="resultsContainer" class="p-6 flex-1 flex flex-col justify-center space-y-3.5">
                    <!-- Initial Empty State -->
                    <div class="text-center py-12 px-4 max-w-sm mx-auto">
                        <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                        </div>
                        <p class="text-sm font-semibold text-slate-700">No screening run yet</p>
                        <p class="text-xs text-slate-500 mt-1">
                            Fill out the form on the left to screen an entity. Matches and export options will appear here.
                        </p>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script>
        const apiKeyInput = document.getElementById("apiKey");
        const downloadControls = document.getElementById("downloadControls");
        const resultsMeta = document.getElementById("resultsMeta");
        let lastScreeningPayload = null;

        apiKeyInput.value = localStorage.getItem("sanctions_api_key") || "";
        apiKeyInput.addEventListener("change", () => {
            localStorage.setItem("sanctions_api_key", apiKeyInput.value.trim());
        });

        function triggerDownload(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function escapeCsv(val) {
            if (val === null || val === undefined) return '""';
            const str = Array.isArray(val) ? val.join("; ") : String(val);
            return `"${str.replace(/"/g, '""')}"`;
        }

        document.getElementById("downloadJsonBtn").addEventListener("click", () => {
            if (!lastScreeningPayload) return;
            const slug = lastScreeningPayload.query.name.toLowerCase().replace(/[^a-z0-9]+/g, "_") || "screening";
            const timestamp = new Date().toISOString().slice(0, 10);
            triggerDownload(
                JSON.stringify(lastScreeningPayload, null, 2),
                `watchlist_${slug}_${timestamp}.json`,
                "application/json"
            );
        });

        document.getElementById("downloadCsvBtn").addEventListener("click", () => {
            if (!lastScreeningPayload) return;
            const slug = lastScreeningPayload.query.name.toLowerCase().replace(/[^a-z0-9]+/g, "_") || "screening";
            const timestamp = new Date().toISOString().slice(0, 10);
            const headers = ["Query Name", "Match ID", "Matched Name", "Schema", "Score", "Birth Date", "Countries", "Aliases", "Dataset"];

            const rows = lastScreeningPayload.results.length > 0
                ? lastScreeningPayload.results.map(item => [
                    escapeCsv(lastScreeningPayload.query.name),
                    escapeCsv(item.id),
                    escapeCsv(item.name),
                    escapeCsv(item.schema || "Entity"),
                    escapeCsv(typeof item.score === "number" ? item.score.toFixed(4) : item.score),
                    escapeCsv(item.birth_date || "N/A"),
                    escapeCsv(item.countries || "N/A"),
                    escapeCsv(item.aliases || ""),
                    escapeCsv(item.dataset || "OpenSanctions")
                ].join(","))
                : [[
                    escapeCsv(lastScreeningPayload.query.name),
                    '""', '"No Matches Found"', '""', '"0.00"', '""', '""', '""', '""'
                ].join(",")];

            const csvContent = [headers.join(","), ...rows].join("\n");
            triggerDownload(csvContent, `watchlist_${slug}_${timestamp}.csv`, "text/csv;charset=utf-8;");
        });

        function getScoreBadgeStyle(score) {
            if (score >= 0.85) return "bg-rose-50 text-rose-700 border-rose-200";
            if (score >= 0.65) return "bg-amber-50 text-amber-700 border-amber-200";
            return "bg-slate-100 text-slate-700 border-slate-200";
        }

        document.getElementById("searchForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const status = document.getElementById("statusText");
            const container = document.getElementById("resultsContainer");
            const submitBtn = document.getElementById("submitBtn");
            const apiKey = apiKeyInput.value.trim();

            if (!apiKey) {
                status.textContent = "Please enter an API key in the top-right field first.";
                status.className = "text-xs text-rose-600 font-medium min-h-[1.25rem] pt-1";
                apiKeyInput.focus();
                return;
            }

            const queryPayload = {
                name: document.getElementById("name").value.trim(),
                birth_date: document.getElementById("birthDate").value.trim(),
                country: document.getElementById("country").value.trim()
            };

            status.textContent = "Screening against watchlists...";
            status.className = "text-xs text-blue-600 font-medium min-h-[1.25rem] pt-1";
            resultsMeta.textContent = `Searching for "${queryPayload.name}"...`;
            downloadControls.classList.add("hidden");
            downloadControls.classList.remove("flex");
            submitBtn.disabled = true;
            submitBtn.classList.add("opacity-70");

            container.classList.add("justify-center");
            container.innerHTML = `
                <div class="text-center py-12">
                    <div class="w-8 h-8 border-2 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                    <p class="text-xs font-medium text-slate-500">Querying global sanctions & PEP lists...</p>
                </div>`;

            const params = new URLSearchParams(queryPayload);

            try {
                const res = await fetch(`/api/screen?${params.toString()}`, {
                    headers: { "X-API-Key": apiKey }
                });
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || "Request failed");
                }

                lastScreeningPayload = {
                    screened_at: new Date().toISOString(),
                    query: queryPayload,
                    count: data.count,
                    remaining_quota: data.remaining_quota,
                    results: data.results || []
                };

                downloadControls.classList.remove("hidden");
                downloadControls.classList.add("flex");

                status.textContent = `Remaining daily quota: ${data.remaining_quota}`;
                status.className = "text-xs text-slate-500 font-medium min-h-[1.25rem] pt-1";
                resultsMeta.textContent = `Found ${data.count} potential match(es) for "${queryPayload.name}"`;

                if (data.results.length === 0) {
                    container.classList.add("justify-center");
                    container.innerHTML = `
                        <div class="bg-emerald-50/90 border border-emerald-200 text-emerald-900 p-5 rounded-2xl text-sm flex items-center gap-3.5">
                            <div class="w-9 h-9 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                </svg>
                            </div>
                            <div>
                                <p class="font-semibold">Clear — No Watchlist Matches Found</p>
                                <p class="text-xs text-emerald-700 mt-0.5">Use the Export buttons above to download a timestamped clearance report.</p>
                            </div>
                        </div>`;
                    return;
                }

                container.classList.remove("justify-center");
                container.innerHTML = data.results.map(item => `
                    <div class="bg-slate-50/60 hover:bg-white p-4 sm:p-5 rounded-xl border border-slate-200/90 hover:border-slate-300 hover:shadow-sm transition-all">
                        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-2.5">
                            <div>
                                <div class="flex flex-wrap items-center gap-2">
                                    <span class="font-bold text-sm sm:text-base text-slate-900">${item.name}</span>
                                    <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-white text-slate-600 border border-slate-200">
                                        ${item.schema || "Entity"}
                                    </span>
                                </div>
                                <div class="flex flex-wrap items-center gap-x-3.5 gap-y-1 text-xs text-slate-500 mt-1.5">
                                    <span><strong class="font-medium text-slate-700">ID:</strong> <span class="font-mono">${item.id}</span></span>
                                    <span><strong class="font-medium text-slate-700">DOB:</strong> ${item.birth_date || "N/A"}</span>
                                    <span><strong class="font-medium text-slate-700">Countries:</strong> ${item.countries || "N/A"}</span>
                                </div>
                            </div>
                            <span class="self-start text-xs font-mono font-semibold px-2.5 py-1 rounded-full border ${getScoreBadgeStyle(item.score)} shrink-0">
                                ${(item.score * 100).toFixed(0)}% (${item.score.toFixed(2)})
                            </span>
                        </div>

                        ${item.aliases ? `
                            <div class="mt-2.5 pt-2.5 border-t border-slate-200/70 text-xs text-slate-600">
                                <span class="font-semibold text-slate-700">Aliases:</span> ${item.aliases}
                            </div>` : ""}

                        <div class="mt-2.5 flex items-center gap-1.5 text-xs text-blue-700 font-medium">
                            <svg class="w-3.5 h-3.5 text-blue-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                            </svg>
                            <span>${item.dataset || "OpenSanctions"}</span>
                        </div>
                    </div>
                `).join("");
            } catch (err) {
                status.textContent = `Error: ${err.message}`;
                status.className = "text-xs text-rose-600 font-medium min-h-[1.25rem] pt-1";
                resultsMeta.textContent = "Screening failed";
                container.classList.add("justify-center");
                container.innerHTML = `
                    <div class="bg-rose-50 border border-rose-200 text-rose-800 p-4 rounded-xl text-xs font-medium text-center">
                        ${err.message}
                    </div>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove("opacity-70");
            }
        });
    </script>
</body>

</html>
