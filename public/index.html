<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanctions & Watchlist Screening</title>
    <script src="https://tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div class="max-w-4xl mx-auto py-10 px-4">
        <header class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Watchlist Screening Portal</h1>
                <p class="text-sm text-slate-500">Fuzzy entity matching powered by OpenSanctions & Atlas Search</p>
            </div>
            <div class="flex items-center gap-2">
                <input id="apiKey" type="password" placeholder="Enter X-API-Key (sk_live_...)"
                    class="border border-slate-300 rounded-lg px-3 py-2 text-sm w-64 bg-white focus:outline-none focus:ring-2 focus:ring-blue-600" />
            </div>
        </header>

        <form id="searchForm"
            class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="md:col-span-2">
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Full Name / Entity *</label>
                <input id="name" type="text" required placeholder="e.g. Vladimir Putin"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Birth Year / Date</label>
                <input id="birthDate" type="text" placeholder="e.g. 1952"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Country Code</label>
                <input id="country" type="text" placeholder="e.g. ru"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
            </div>
            <div class="md:col-span-4 flex items-center justify-between pt-2">
                <span id="statusText" class="text-xs text-slate-500"></span>
                <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm px-5 py-2.5 rounded-lg transition">
                    Screen Entity
                </button>
            </div>
        </form>

        <div id="resultsContainer" class="space-y-3"></div>
    </div>

    <script>
        const apiKeyInput = document.getElementById("apiKey");
        apiKeyInput.value = localStorage.getItem("sanctions_api_key") || "";
        apiKeyInput.addEventListener("change", () => {
            localStorage.setItem("sanctions_api_key", apiKeyInput.value.trim());
        });

        document.getElementById("searchForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const status = document.getElementById("statusText");
            const container = document.getElementById("resultsContainer");
            const apiKey = apiKeyInput.value.trim();

            if (!apiKey) {
                status.textContent = "Please enter an API key in the top-right box first.";
                status.className = "text-xs text-red-600 font-medium";
                return;
            }

            status.textContent = "Screening against watchlists...";
            status.className = "text-xs text-slate-500";
            container.innerHTML = "";

            const params = new URLSearchParams({
                name: document.getElementById("name").value,
                birth_date: document.getElementById("birthDate").value,
                country: document.getElementById("country").value
            });

            try {
                const res = await fetch(`/api/screen?${params.toString()}`, {
                    headers: { "X-API-Key": apiKey }
                });
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || "Request failed");
                }

                status.textContent = `Found ${data.count} potential match(es) • Remaining daily quota: ${data.remaining_quota}`;
                status.className = "text-xs text-slate-600 font-medium";

                if (data.results.length === 0) {
                    container.innerHTML = `
            <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-xl text-sm">
              No watchlist matches found.
            </div>`;
                    return;
                }

                container.innerHTML = data.results.map(item => `
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex items-start justify-between gap-4">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-base text-slate-900">${item.name}</span>
                  <span class="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-600">${item.schema || "Entity"}</span>
                </div>
                <p class="text-xs text-slate-500 mt-1">
                  <strong>ID:</strong> ${item.id} &nbsp;|&nbsp;
                  <strong>DOB:</strong> ${item.birth_date || "N/A"} &nbsp;|&nbsp;
                  <strong>Countries:</strong> ${item.countries || "N/A"}
                </p>
              </div>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-100 text-amber-800">
                Score: ${item.score.toFixed(2)}
              </span>
            </div>
            ${item.aliases ? `<p class="text-xs text-slate-600 mt-2"><strong>Aliases:</strong> ${item.aliases}</p>` : ""}
            <p class="text-xs text-blue-700 mt-2"><strong>Lists:</strong> ${item.dataset || "OpenSanctions"}</p>
          </div>
        `).join("");
            } catch (err) {
                status.textContent = `Error: ${err.message}`;
                status.className = "text-xs text-red-600 font-medium";
            }
        });
    </script>
</body>

</html>
